# Test-only configuration.
#
# Overrides the main application.properties in two ways:
#
# 1. Datasource: an in-memory H2 database (MySQL compatibility mode) so
#    `mvn test` can run the full Spring context and JPA layer without
#    requiring a live MySQL server.
#
# 2. Schema ownership: Flyway is DISABLED for tests, and Hibernate is set
#    to 'create-drop' instead of 'validate'. The production schema
#    (V1__initial_schema.sql) uses MySQL-specific syntax (AUTO_INCREMENT,
#    CHECK constraints referencing MySQL semantics, etc.) that is not
#    guaranteed to be portable to H2. Rather than fight that portability
#    gap, tests let Hibernate generate a fresh schema directly from the
#    JPA entity annotations against H2 for every test run - this still
#    fully exercises entity mappings, relationships, unique constraints,
#    and optimistic locking (all of which are enforced at the JPA/entity
#    level, not just in the migration SQL), which is what this phase's
#    tests are verifying. The Flyway migration itself is validated by
#    actually running the backend against real MySQL, not by these tests.
#
# This file is never packaged into the runtime JAR - it only exists on
# the test classpath.

spring.datasource.url=jdbc:h2:mem:digicash_test;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.flyway.enabled=false

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=false
