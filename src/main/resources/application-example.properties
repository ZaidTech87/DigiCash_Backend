# DIGICASH Backend - example environment reference
#
# This file is NOT loaded automatically by Spring Boot (it is not
# activated via spring.profiles.active). It exists purely as a
# documented template showing which environment variables
# application.properties expects, with example (non-secret) values.
#
# To run the backend locally, EITHER:
#   1. Export these as real environment variables before running
#      `mvn spring-boot:run` / the packaged JAR, e.g.:
#         export DB_HOST=localhost
#         export DB_PORT=3306
#         export DB_NAME=digicash
#         export DB_USERNAME=root
#         export DB_PASSWORD=your_real_password_here
#   2. OR pass them as -D system properties / --command-line args when
#      launching the JAR, e.g.:
#         java -jar digicash-backend.jar --DB_PASSWORD=your_real_password_here
#
# Never commit a copy of this file with a real password filled in.

SERVER_PORT=8080

DB_HOST=localhost
DB_PORT=3306
DB_NAME=digicash
DB_USERNAME=root
DB_PASSWORD=changeme

JPA_DDL_AUTO=validate
JPA_SHOW_SQL=false
