services:
  mysql:
    image: mysql:8.0
    container_name: digicash-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_NAME:-digicash}
      MYSQL_USER: ${DB_USERNAME:-digicash_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in your environment before running docker compose}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in your environment before running docker compose}
    ports:
      - "${DB_PORT:-3306}:3306"
    volumes:
      - digicash-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  digicash-mysql-data:
